type = "forbidden"
source_modules = ["app.modules.reports"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.day_cycle",
  "app.modules.assistant"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "day_cycle depends only on core, crypto, tasks, predictor, reports"
type = "forbidden"
source_modules = ["app.modules.day_cycle"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.ai_gateway",
