[project]
name = "daily-assistant-backend"
version = "0.1.0"
description = "Personal Daily Assistant - FastAPI modular monolith"
# 3.12 is the target (Docker image, CI via .python-version); local dev may use a newer interpreter (<3.15).
requires-python = ">=3.12,<3.15"
# M0 carries only what core needs. Later milestones add their own dependencies with their modules
# (crypto: cryptography; auth: pwdlib/PyJWT; ai_gateway: openrouter/groq; reports: pandas/matplotlib/...).
dependencies = [
    "fastapi>=0.121",  # Depends(scope="function") is relied on by core.db.SessionDep
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tzdata>=2024.1",
    "cryptography>=43",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "freezegun>=1.5",
    "import-linter>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false          # application, not a library: `app` is imported from the backend/ working directory

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
markers = ["db: needs a real Postgres (TEST_DATABASE_URL); skipped when it is not set"]

[tool.coverage.run]
source = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# DTZ: no naive datetimes / datetime.now() without tz (constitution: all time goes through Clock)
select = ["E", "F", "I", "UP", "B", "DTZ", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the FastAPI idiom
    "E501",  # `ruff format` wraps code; long docstrings/comments are left to the author
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
mypy_path = "."
explicit_package_bases = true
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["grimp.*", "importlinter.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- import-linter (core spec §7.8)
# One `forbidden` contract per module, generated mechanically from the allowed-dependency table
# (all other modules + app.main are forbidden). The "package root only" rule is enforced by
# tests/core/test_boundaries.py because import-linter cannot express it concisely.
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "crypto is a leaf"
type = "forbidden"
source_modules = ["app.modules.crypto"]
forbidden_modules = ["app.main", "app.modules.core", "app.modules.auth", "app.modules.schedule",
  "app.modules.tasks", "app.modules.day_cycle", "app.modules.ai_gateway", "app.modules.feasibility",
  "app.modules.predictor", "app.modules.assistant", "app.modules.reports", "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core depends only on crypto"
type = "forbidden"
source_modules = ["app.modules.core"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.tasks",
  "app.modules.day_cycle", "app.modules.ai_gateway", "app.modules.feasibility", "app.modules.predictor",
  "app.modules.assistant", "app.modules.reports", "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "auth depends only on core"
type = "forbidden"
source_modules = ["app.modules.auth"]
forbidden_modules = ["app.main", "app.modules.crypto", "app.modules.schedule", "app.modules.tasks",
  "app.modules.day_cycle", "app.modules.ai_gateway", "app.modules.feasibility", "app.modules.predictor",
  "app.modules.assistant", "app.modules.reports", "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "schedule depends only on core, crypto"
type = "forbidden"
source_modules = ["app.modules.schedule"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.tasks", "app.modules.day_cycle",
  "app.modules.ai_gateway", "app.modules.feasibility", "app.modules.predictor", "app.modules.assistant",
  "app.modules.reports", "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tasks depends only on core, crypto"
type = "forbidden"
source_modules = ["app.modules.tasks"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.day_cycle",
  "app.modules.ai_gateway", "app.modules.feasibility", "app.modules.predictor", "app.modules.assistant",
  "app.modules.reports", "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ai_gateway depends only on core, crypto"
type = "forbidden"
source_modules = ["app.modules.ai_gateway"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.tasks",
  "app.modules.day_cycle", "app.modules.feasibility", "app.modules.predictor", "app.modules.assistant",
  "app.modules.reports", "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "email depends only on core, crypto"
type = "forbidden"
source_modules = ["app.modules.email"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.tasks",
  "app.modules.day_cycle", "app.modules.ai_gateway", "app.modules.feasibility", "app.modules.predictor",
  "app.modules.assistant", "app.modules.reports"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "predictor depends only on core, crypto, tasks"
type = "forbidden"
source_modules = ["app.modules.predictor"]
forbidden_modules = ["app.main", "app.modules.auth", "app.modules.schedule", "app.modules.day_cycle",
  "app.modules.ai_gateway", "app.modules.feasibility", "app.modules.assistant", "app.modules.reports",
  "app.modules.email"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "feasibility depends only on core, crypto, tasks, schedule, predictor, ai_gateway"
