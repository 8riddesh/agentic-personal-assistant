name: daily_assistant
description: Personal Daily Assistant - Android client (Flutter).
publish_to: "none"

# X.Y.Z+N - N (versionCode) must strictly increase for in-place updates (plan §14.4).
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  flutter_local_notifications: ^19.0.0
  android_intent_plus: ^5.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
