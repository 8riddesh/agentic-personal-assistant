name: release-apk

# Push a tag `vX.Y.Z` -> signed release APK attached to a GitHub Release (plan §14.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_B64 secret is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/daily-assistant.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=daily-assistant.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze + test
        run: |
          flutter analyze
          flutter test

      - name: Build signed release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}   # https://<service>.onrender.com (not a secret, but keeps it out of the repo)
        run: |
          test -n "$API_BASE_URL" || { echo "::error::API_BASE_URL secret is not set"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
